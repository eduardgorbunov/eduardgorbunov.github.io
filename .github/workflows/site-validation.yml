name: Site validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run static site checks
        run: python3 scripts/check-site.py

      - name: Check JavaScript syntax
        run: |
          node --check assets/theme/js/script.js
          node --check assets/theme/js/publication-filters.js
          node --check assets/theme/js/activity-filters.js

      - name: Verify synchronized files are current
        run: |
          python3 scripts/sync-site.py
          git diff --exit-code -- .
          git diff --check
